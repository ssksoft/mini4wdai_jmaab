# 3dsim / Python control: model tests on every push and pull request,
# and a GitHub Release with the quickstart PDF when a tag like v1.0.0 is pushed.
name: pysim

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["3dsim/MiniAI_PySim/**", "3dsim/docs/**", "README.md", ".github/workflows/pysim.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false            # the tests need no LFS assets (saves LFS bandwidth)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as Unreal Engine 5.8's embedded Python
      - run: pip install pytest
      - run: pytest -q 3dsim/MiniAI_PySim/tests

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install pandoc and Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y pandoc fonts-noto-cjk
      - name: Build quickstart PDF
        run: python 3dsim/MiniAI_PySim/tools/build_docs.py --out dist
        env:
          CHROME: google-chrome
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" dist/quickstart.pdf --title "3dsim $GITHUB_REF_NAME" --notes "変更点は 3dsim/CHANGELOG.md を参照してください。"
        env:
          GH_TOKEN: ${{ github.token }}
